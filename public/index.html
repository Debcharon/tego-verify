<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>tego · Verify</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f3f5f8; color: #17212d; }
    main { width: min(100%, 430px); padding: 30px; border: 1px solid #dce3eb; border-radius: 20px; background: #fff; box-shadow: 0 16px 50px #17212d12; }
    .mark { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: #dceeff; color: #006eb9; font-weight: 800; letter-spacing: -.08em; }
    h1 { margin: 22px 0 8px; font-size: 26px; line-height: 1.2; }
    p { margin: 0; line-height: 1.55; color: #526171; }
    #widget { min-height: 72px; margin: 28px 0 18px; }
    button { width: 100%; min-height: 48px; padding: 12px 18px; border: 0; border-radius: 11px; background: #0077c8; color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .52; cursor: not-allowed; }
    #status { min-height: 24px; margin-top: 16px; font-size: 14px; }
    .foot { margin-top: 24px; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      body { background: #111923; color: #edf4fc; }
      main { background: #1b2734; border-color: #324354; box-shadow: none; }
      p { color: #b2c2d1; }
      .mark { background: #163b56; color: #8bd2ff; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">t</div>
    <h1 id="title">Verify to continue</h1>
    <p id="description">Complete this check before sending a private message to tego.</p>
    <div id="widget"></div>
    <button id="submit" type="button" disabled>Verify and continue</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="foot" id="foot">After verification, return to the chat and send your message again.</p>
  </main>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const copy = navigator.language.toLowerCase().startsWith("zh") ? {
      title: "验证后继续",
      description: "完成验证后，才能向 tego 发送私聊消息。",
      submit: "验证并继续",
      foot: "验证通过后，请返回聊天并重新发送消息。",
      loading: "正在加载验证…",
      ready: "请先完成上方验证。",
      sending: "正在核验…",
      done: "验证已完成，正在返回 Telegram…",
      invalid: "请从 tego 聊天中的验证按钮打开此页面。",
      failed: "验证码未通过，请重新完成验证。",
      expired: "验证链接无效或已过期，请在机器人聊天中重新获取验证按钮。",
      unavailable: "验证服务暂时不可用，请稍后重试。",
      network: "请求失败，请检查网络后重试。",
    } : {
      title: "Verify to continue",
      description: "Complete this check before sending a private message to tego.",
      submit: "Verify and continue",
      foot: "After verification, return to the chat and send your message again.",
      loading: "Loading verification…",
      ready: "Complete the check above first.",
      sending: "Checking your response…",
      done: "Verified. Returning to Telegram…",
      invalid: "Open this page from the verification button in the tego chat.",
      failed: "The CAPTCHA was not accepted. Please complete it again.",
      expired: "This verification link is invalid or expired. Request a new button in the bot chat.",
      unavailable: "The verification service is unavailable. Please try again later.",
      network: "The request failed. Check your connection and try again.",
    };
    for (const id of ["title", "description", "submit", "foot"]) {
      document.getElementById(id).textContent = copy[id];
    }
    const telegram = window.Telegram && window.Telegram.WebApp;
    const challenge = new URLSearchParams(location.search).get("challenge");
    const button = document.getElementById("submit");
    const status = document.getElementById("status");
    let responseToken = "";
    let resetWidget = () => {};
    const setStatus = (text) => { status.textContent = text; };

    async function begin() {
      if (!telegram || !challenge || challenge.length > 256) {
        setStatus(copy.invalid);
        return;
      }
      telegram.ready();
      telegram.expand();
      setStatus(copy.loading);
      try {
        const response = await fetch("/api/config", { cache: "no-store" });
        if (!response.ok) throw new Error("configuration unavailable");
        const config = await response.json();
        if (!config.siteKey) throw new Error("site key unavailable");
        const solved = (token) => {
          responseToken = token;
          button.disabled = false;
          setStatus("");
        };
        const expired = () => {
          responseToken = "";
          button.disabled = true;
          setStatus(copy.ready);
        };
        const failed = () => {
          responseToken = "";
          button.disabled = true;
          setStatus(copy.failed);
        };
        const renderWidget = (api, options) => {
          try {
            const widgetID = api.render(config.provider === "turnstile" ? "#widget" : "widget", {
              sitekey: config.siteKey,
              callback: solved,
              "expired-callback": expired,
              "error-callback": failed,
              ...options,
            });
            resetWidget = () => api.reset(widgetID);
            setStatus(copy.ready);
          } catch {
            failed();
          }
        };
        const script = document.createElement("script");
        script.async = true;
        script.onerror = failed;
        if (config.provider === "turnstile") {
          script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
          script.onload = () => renderWidget(window.turnstile, {
            action: "tego_verify",
            theme: "auto",
          });
        } else if (config.provider === "hcaptcha") {
          window.tegoHCaptchaReady = () => {
            renderWidget(window.hcaptcha, {
              theme: window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light",
            });
            delete window.tegoHCaptchaReady;
          };
          script.src = "https://js.hcaptcha.com/1/api.js?onload=tegoHCaptchaReady&render=explicit&recaptchacompat=off";
        } else {
          throw new Error("unsupported verification provider");
        }
        document.head.append(script);
      } catch {
        setStatus(copy.failed);
      }
    }

    button.addEventListener("click", async () => {
      if (!responseToken || !telegram) return;
      button.disabled = true;
      setStatus(copy.sending);
      let failureCode = "network";
      try {
        const response = await fetch("/api/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            challenge,
            token: responseToken,
          }),
        });
        const result = await response.json();
        if (!response.ok || !result.proof) {
          failureCode = result.code || "captcha_rejected";
          throw new Error("verification rejected");
        }
        responseToken = "";
        setStatus(copy.done);
        telegram.sendData(result.proof);
      } catch {
        responseToken = "";
        setStatus(failureCode === "invalid_ticket" ? copy.expired
          : failureCode === "provider_unavailable" ? copy.unavailable
          : failureCode === "network" ? copy.network : copy.failed);
        resetWidget();
      }
    });
    begin();
  </script>
</body>
</html>
